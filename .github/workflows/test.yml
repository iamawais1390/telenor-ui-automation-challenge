name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout previous Allure report (for trend history)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: allure-reports-branch
          path: allure-reports-branch

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps

      - run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Everything below only runs against main (via push, or a manual
      # workflow_dispatch run) - PRs get the Playwright HTML artifact
      # above, not a published Allure report.
      #
      # simple-elf/allure-report-action runs Allure's report generation
      # inside its own Docker container (which bundles Java internally),
      # and merges in the previous run's history for trend continuity -
      # so unlike a runner-side `allure generate`, no JDK setup is needed
      # on the runner itself.
      - name: Build Allure report
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: simple-elf/allure-report-action@v1.15
        with:
          allure_results: allure-results
          gh_pages: allure-reports-branch
          allure_history: allure-history
          keep_reports: 20

      - name: Publish report to allure-reports-branch
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: allure-reports-branch
          publish_dir: allure-history
